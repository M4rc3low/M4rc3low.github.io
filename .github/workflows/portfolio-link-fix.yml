name: Temporary portfolio link fix

on:
  push:
    branches: [chore/repository-polish]

permissions:
  contents: write

jobs:
  fix-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/repository-polish

      - name: Update LinkedIn URL
        run: |
          python - <<'PY'
          from pathlib import Path
          old = "https://www.linkedin.com/in/marcelo-s-gomes-019792389/"
          new = "https://www.linkedin.com/in/marcelo-s-gomes/"
          changed = []
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              if old in text:
                  path.write_text(text.replace(old, new), encoding='utf-8')
                  changed.append(str(path))
          print('Updated:', ', '.join(changed) if changed else 'none')
          PY

      - name: Commit link fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "No link changes to commit."
          else
            git commit -m "fix: update LinkedIn link in portfolio pages"
            git push origin HEAD:chore/repository-polish
          fi
